name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, build, lint, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w server
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public

      - name: Typecheck
        run: npm run typecheck

      - name: Build server
        run: npm run build -w server

      - name: Build frontend
        run: npm run build -w frontend

      - name: Lint frontend
        run: npm run lint -w frontend

      - name: Audit production dependencies
        run: npm audit --workspaces --omit=dev --omit=optional --audit-level=high