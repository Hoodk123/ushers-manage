name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, build, lint, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w server
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public

      - name: Typecheck
        run: npm run typecheck

      - name: Build server
        run: npm run build -w server

      - name: Build frontend
        run: npm run build -w frontend

      - name: Lint frontend
        run: npm run lint -w frontend

      - name: Audit production dependencies
        run: npm audit --workspaces --omit=dev --omit=optional --audit-level=high